[project]
name = "sample-agent"
version = "0.1.0"
description = "Agente didáctico de soporte TI con Microsoft Agent Framework"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core==1.22.0",
    "agent-framework-openai==1.17.0",
    "aiohttp==3.14.5",
    "azure-identity==1.26.0",
    "fastapi==0.157.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
